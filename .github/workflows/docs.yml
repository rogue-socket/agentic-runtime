name: Update Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'workflows/**'
      - 'src/agent_runtime/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install .
          pip install PyYAML watchdog

      - name: Generate Workflow Reference
        run: |
          # Use the CLI to rebuild workflow references and the static index
          ai docs --path .

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/content.js docs/docs-manifest.json docs/guide/workflow-reference-generated.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update docs index and reference" && git push)
