name: Build Docs Content

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.md'        # any markdown doc added or changed
      - 'docs/build-content.py' # or the builder itself

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write            # needed to push the rebuilt content.js back

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so the commit author context is correct
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild content.js
        run: python docs/build-content.py

      - name: Commit and push content.js if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if content.js actually differs
          if git diff --quiet docs/content.js; then
            echo "content.js is up to date — nothing to commit."
            exit 0
          fi

          git add docs/content.js
          git commit -m "chore(docs): rebuild content.js [skip ci]"
          git push
