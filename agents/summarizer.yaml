agent:
  id: summarizer
  version: v1
  description: "Summarizes issues into concise reports with root-cause analysis"
  system: prompts.summarizer_system
  tools:
    - tools.echo
  strategy:
    type: single
  output_key: summary
  temperature: 0.3
  max_tokens: 2048
  pipeline:
    - id: main
      type: model
      prompt: |
        Summarize the following issue in 2-3 sentences. Call out the likely root cause
        and suggest immediate next steps.

        Issue: {{ inputs.issue }}
  prompts:
    - id: summarizer_system
      version: v1
      text: |
        You are a technical writer. Summarize the given issue or text
        into a brief, clear summary suitable for a status report.
        Focus on what happened, the impact, and the current state.
