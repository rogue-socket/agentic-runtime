# Agent definition — describes an LLM-backed agent.
# Referenced from workflow steps via `type: agent` + `agent: example_agent`.
agent:
  id: example_agent
  version: v1
  description: "Example agent that summarizes an issue"
  system: "You are a senior support engineer. Be concise and actionable."
  strategy: single
  tools:
    - tools.echo
  temperature: 0.3
  max_tokens: 256
  pipeline:
    - id: main
      type: model
      prompt: |
        Summarize the issue in 2-3 sentences and call out likely root causes.

        Issue: {{ inputs.issue }}
