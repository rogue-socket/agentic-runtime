<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="12" fill="url(#bg)" />

  <!-- Subtle border -->
  <rect width="860" height="280" rx="12" fill="none" stroke="#30363d" stroke-width="1.5" />

  <!-- Trees (ASCII art rendered as text) -->
  <text font-family="'Courier New', Courier, monospace" font-size="13" fill="#2d6a4f" opacity="0.9" text-anchor="middle">
    <tspan x="430" dy="44">    *         *        *          *         *</tspan>
    <tspan x="430" dy="16">   ***       ***      ***        ***       ***</tspan>
    <tspan x="430" dy="16">  *****     *****    *****      *****     *****</tspan>
    <tspan x="430" dy="16"> *******   *******  *******    *******   *******</tspan>
    <tspan x="430" dy="16">    |          |       |           |         |</tspan>
  </text>

  <!-- Separator line -->
  <line x1="215" y1="152" x2="645" y2="152" stroke="#2d6a4f" stroke-width="1" opacity="0.5" />

  <!-- ForrestRun name -->
  <text
    x="430" y="195"
    font-family="'Courier New', Courier, monospace"
    font-size="34"
    font-weight="bold"
    fill="url(#nameGrad)"
    text-anchor="middle"
    letter-spacing="8"
  >ForrestRun</text>

  <!-- Subtitle -->
  <text
    x="430" y="228"
    font-family="'Courier New', Courier, monospace"
    font-size="13"
    fill="#8b949e"
    text-anchor="middle"
    letter-spacing="2"
  >deterministic  ·  agentic runtime</text>
</svg>
