# File: workflows/example.yaml
# Purpose: Baseline runnable workflow used by CLI examples and smoke checks.
# Description: Demonstrates a linear model->tool flow with retry behavior.
# Dependencies: `generate_summary` handler and `tools.echo` tool registration.
# Inputs/Outputs: Reads `inputs.issue`; writes `steps.generate_summary` and `steps.echo_tool`.
# Side Effects: Tool execution emits structured events and persists run history/state.

workflow:
  id: example_workflow
  version: v1
on_error: fail_fast
steps:
  - id: generate_summary
    type: model
    handler: generate_summary
    inputs:
      issue: inputs.issue
    retry:
      attempts: 3
      backoff: exponential
      initial_delay: 1
  - id: echo_tool
    type: tool
    tool: tools.echo
    inputs:
      message: steps.generate_summary.summary
