# File: workflows/samples/versioning/code_review_agent_v1.yaml
# Purpose: Versioned workflow sample (v1) for registry resolution tests.
# Description: Baseline two-step code review workflow for version comparison demos.
# Dependencies: Workflow registry (`workflow.id` + `version`), functions/stubs.py, tools.echo
# Inputs/Outputs: Reads `inputs.issue`; writes summary and echo output.
# Side Effects: Produces run metadata with workflow_version=v1.

workflow:
  id: code_review_agent
  version: v1
inputs:
  issue:
    description: The issue text for code review
    default: "Login API fails for invalid token"
on_error: fail_fast
steps:
  - id: generate_summary
    type: function
    function: stubs.generate_summary
    inputs:
      issue: inputs.issue

  - id: echo_summary
    type: tool
    tool: tools.echo
    inputs:
      message: steps.generate_summary.summary
