# File: workflows/samples/versioning/code_review_agent_v2.yaml
# Purpose: Versioned workflow sample (v2) extending v1.
# Description: Adds a finalization step to illustrate workflow evolution across versions.
# Dependencies: Workflow registry latest-version selection, functions/stubs.py, tools.echo
# Inputs/Outputs: Reads `inputs.issue`; writes summary, echo summary, and finalization outputs.
# Side Effects: Produces run metadata with workflow_version=v2.

workflow:
  id: code_review_agent
  version: v2
inputs:
  issue:
    description: The issue text for code review
    default: "Login API fails for invalid token"
on_error: fail_fast
steps:
  - id: generate_summary
    type: function
    function: stubs.generate_summary
    inputs:
      issue: inputs.issue

  - id: echo_summary
    type: tool
    tool: tools.echo
    inputs:
      message: steps.generate_summary.summary

  - id: finalization
    type: tool
    tool: tools.echo
    inputs:
      message: "code_review_agent v2 completed"
