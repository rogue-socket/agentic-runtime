schema_version: 2
# File: workflows/samples/05_llm_call.yaml
# Purpose: Demonstrate a real LLM-backed workflow using type: agent.
# Description: Takes an issue description, summarizes it via an LLM agent step,
#   then proposes a fix. Requires an agent definition in agents/ and a configured
#   LLM provider in runtime.yaml with the corresponding API key set.
# Dependencies: agents/summarizer.yaml, agents/fixer.yaml, tools.echo
# Inputs/Outputs: Reads inputs.issue; produces LLM-generated summary and fix.
# Side Effects: Makes HTTP calls to the configured LLM provider API.
#
# Setup:
#   1. Configure an LLM provider in runtime.yaml:
#        llm:
#          providers:
#            - name: openai
#              api_key_env: OPENAI_API_KEY
#              models: [gpt-4o-mini]
#   2. Set the API key: export OPENAI_API_KEY=sk-...
#   3. Run: ai run workflows/samples/05_llm_call.yaml -i issue="Login fails with 401"

workflow:
  id: llm_issue_summary
  version: v1

inputs:
  issue:
    description: The issue text to summarize and propose a fix for
    default: "Users report intermittent 500 errors on the /api/checkout endpoint under high load."

on_error: fail_fast

steps:
  - id: summarize
    type: agent
    agent: summarizer
    inputs:
      issue: inputs.issue

  - id: echo_summary
    type: tool
    tool: tools.echo
    inputs:
      message: steps.summarize.summary

  - id: propose_fix
    type: agent
    agent: fixer
    inputs:
      issue: inputs.issue
      summary: steps.summarize.summary

  - id: echo_fix
    type: tool
    tool: tools.echo
    inputs:
      message: steps.propose_fix.next_steps
