# File: workflows/samples/05_llm_call.yaml
# Purpose: Demonstrate a real LLM-backed workflow using handler: llm.
# Description: Takes an issue description, summarizes it via an LLM call,
#   then proposes a fix. Requires a configured LLM provider in runtime.yaml
#   and the corresponding API key set in the environment.
# Dependencies: handler: llm, tools.echo
# Inputs/Outputs: Reads inputs.issue; produces LLM-generated summary and fix.
# Side Effects: Makes HTTP calls to the configured LLM provider API.
#
# Setup:
#   1. Configure an LLM provider in runtime.yaml:
#        llm:
#          providers:
#            - name: openai
#              api_key_env: OPENAI_API_KEY
#              models: [gpt-4o-mini]
#   2. Set the API key: export OPENAI_API_KEY=sk-...
#   3. Run: ai run workflows/samples/05_llm_call.yaml -i issue="Login fails with 401"

workflow:
  id: llm_issue_summary
  version: v1

inputs:
  issue:
    description: The issue text to summarize and propose a fix for
    default: "Users report intermittent 500 errors on the /api/checkout endpoint under high load."

on_error: fail_fast

steps:
  - id: summarize
    type: model
    handler: llm
    model: gpt-4o-mini
    prompt: "Summarize this issue in 2-3 concise sentences:\n\n{{ inputs.issue }}"
    system: "You are a senior software engineer triaging production issues. Be concise and precise."
    temperature: 0.3
    max_tokens: 256
    response_key: summary
    inputs:
      issue: inputs.issue

  - id: echo_summary
    type: tool
    tool: tools.echo
    inputs:
      message: steps.summarize.summary

  - id: propose_fix
    type: model
    handler: llm
    model: gpt-4o-mini
    prompt: "Given this issue summary, propose a concrete fix with specific steps:\n\nIssue: {{ inputs.issue }}\nSummary: {{ steps.summarize.summary }}"
    system: "You are a senior software engineer. Propose actionable fixes, not vague suggestions. Include specific code changes or configuration updates where applicable."
    temperature: 0.5
    max_tokens: 512
    response_key: fix_proposal
    inputs:
      issue: inputs.issue
      summary: steps.summarize.summary

  - id: echo_fix
    type: tool
    tool: tools.echo
    inputs:
      message: steps.propose_fix.fix_proposal
