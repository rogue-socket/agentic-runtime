# File: workflows/samples/03_branching_triage.yaml
# Purpose: Demonstrates deterministic conditional branch routing.
# Description: Classifies input issue text and routes to bug/feature/default tool steps.
# Dependencies: Branch evaluation engine, `generate_summary`, and `tools.echo`.
# Inputs/Outputs: Reads `inputs.issue`; executes one branch path and writes selected step outputs.
# Side Effects: Persists branch path in step execution history.

workflow:
  id: branching_triage
  version: v1
on_error: fail_fast
steps:
  - id: classify_issue
    type: model
    handler: generate_summary
    inputs:
      issue: inputs.issue
    next:
      - when: state.inputs.issue == "bug"
        goto: bug_path
      - when: state.inputs.issue == "feature"
        goto: feature_path
      - default: default_path

  - id: bug_path
    type: tool
    tool: tools.echo
    inputs:
      message: "routing: bug"

  - id: feature_path
    type: tool
    tool: tools.echo
    inputs:
      message: "routing: feature"

  - id: default_path
    type: tool
    tool: tools.echo
    inputs:
      message: "routing: default"
