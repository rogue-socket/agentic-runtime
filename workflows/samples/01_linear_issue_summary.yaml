# File: workflows/samples/01_linear_issue_summary.yaml
# Purpose: Minimal linear workflow sample.
# Description: Runs a summary function step then echoes the result through a tool.
# Dependencies: functions/stubs.py, tools.echo
# Inputs/Outputs: Reads `inputs.issue`; emits per-step outputs under `steps.*`.
# Side Effects: Persists run/step/state history in storage.

workflow:
  id: linear_issue_summary
  version: v1
inputs:
  issue:
    description: The issue text to summarize
    default: "Login API fails for invalid token"
on_error: fail_fast
steps:
  - id: generate_summary
    type: function
    function: stubs.generate_summary
    inputs:
      issue: inputs.issue

  - id: echo_summary
    type: tool
    tool: tools.echo
    inputs:
      message: steps.generate_summary.summary
