# File: workflows/samples/04_fail_and_resume.yaml
# Purpose: Demonstrates failure handling and resume semantics.
# Description: Intentionally references a missing tool adapter to force a failed run state.
# Dependencies: `generate_summary` handler and missing `tools.missing_adapter`.
# Inputs/Outputs: Reads `inputs.issue`; fails before finalization step on missing tool lookup.
# Side Effects: Creates a FAILED run suitable for `ai resume` demonstration.

workflow:
  id: fail_and_resume
  version: v1
on_error: fail_fast
steps:
  - id: generate_summary
    type: model
    handler: generate_summary
    inputs:
      issue: inputs.issue

  - id: failing_external_call
    type: tool
    tool: tools.missing_adapter
    inputs:
      message: steps.generate_summary.summary

  - id: finalization
    type: tool
    tool: tools.echo
    inputs:
      message: "done"
