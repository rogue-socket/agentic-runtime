<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="180" rx="12" fill="url(#bg)" />

  <!-- Subtle border -->
  <rect width="860" height="180" rx="12" fill="none" stroke="#30363d" stroke-width="1.5" />

  <!-- ForrestRun name -->
  <text
    x="430" y="100"
    font-family="'Courier New', Courier, monospace"
    font-size="52"
    font-weight="bold"
    fill="url(#nameGrad)"
    text-anchor="middle"
    letter-spacing="10"
  >ForrestRun</text>

  <!-- Subtitle -->
  <text
    x="430" y="138"
    font-family="'Courier New', Courier, monospace"
    font-size="14"
    fill="#8b949e"
    text-anchor="middle"
    letter-spacing="3"
  >deterministic  ·  agentic runtime</text>
</svg>
