<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentic Runtime Docs</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AR</div>
        <div class="brand-text">
          <div class="brand-title">Agentic Runtime</div>
          <div class="brand-subtitle">Docs Navigator</div>
        </div>
        <button id="collapse" class="collapse" type="button" aria-label="Toggle sidebar">☰</button>
      </div>

      <div class="search">
        <input id="search" type="search" placeholder="Search docs" />
        <button id="clear" type="button">Clear</button>
      </div>

      <nav id="nav" class="nav">
        <!-- Dynamic Nav content will be injected by app.js -->
      </nav>
    </aside>

    <main class="main">
      <header class="header">
        <div>
          <div class="eyebrow">Documentation</div>
          <h1 id="doc-title">Getting Started</h1>
        </div>
        <div class="header-actions">
          <button id="collapse-main" class="button ghost" type="button">Menu</button>
          <a id="raw-link" class="button" href="./guide/getting-started.md" target="_blank" rel="noopener">Open Raw</a>
        </div>
      </header>

      <section class="content">
        <div id="doc-content" class="doc"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="./content.js"></script>
  <script src="./app.js"></script>
</body>
</html>
