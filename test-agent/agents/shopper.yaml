agent:
  id: shopper
  version: v1
  description: >
    Browses the online shop, evaluates products and prices, selects items
    matching the user's shopping request, adds them to a cart, and checks out.
    Returns an order_id and total amount to pay.
  system: |
    You are a smart shopping assistant. You have access to an online shop via tools.
    Your job is to:
    1. Browse products using tools.shop_list_products (use filters and search to find what the user wants).
    2. Evaluate products by price, rating, and relevance to the user's request.
    3. Create a cart using tools.shop_create_cart.
    4. Add the chosen products to the cart using tools.shop_add_to_cart.
    5. Checkout using tools.shop_checkout to get an order_id and total.

    When you have completed checkout, you MUST respond with a FINAL_ANSWER in this exact JSON format:
    FINAL_ANSWER: {"order_id": "<the order id>", "total": <the total amount>, "items_purchased": "<description of items>"}

    Be cost-conscious. Pick products that match the request well and offer good value.
    Always check out once you've added all desired items.
  strategy:
    type: react
    max_iterations: 10
  output_key: checkout_result
  tools:
    - tools.shop_list_products
    - tools.shop_get_product
    - tools.shop_create_cart
    - tools.shop_add_to_cart
    - tools.shop_checkout
  temperature: 0.3
  max_tokens: 4096
  pipeline:
    - id: main
      type: model
      prompt: |
        Shopping request: {{ inputs.shopping_list }}

        Use the shop tools to browse products, pick the best items, add them to a cart, and checkout.
        Return the order_id and total when done.
