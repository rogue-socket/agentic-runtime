# Shopping Workflow
# ─────────────────────────────────────────────────────────────────────
# An autonomous shopping agent workflow that:
#   1. Browses an online shop (localhost:8000), picks products, checks out
#   2. Pays for the order via a bank account (localhost:5000)
#   3. Verifies payment confirmation and returns the result
#
# Prerequisites:
#   - Shop backend running on http://localhost:8000
#   - Payment backend running on http://localhost:5000
#   - LLM provider configured (run `ai setup` first)
#
# Run:
#   cd test-agent
#   ai run shopping -i shopping_list="Buy a good book and some electronics under 50 dollars"

workflow:
  id: shopping
  version: v1

inputs:
  shopping_list:
    description: What the agent should buy from the shop
    default: "Buy one highly-rated electronics item and one book, staying under a total budget of 100 dollars"

on_error: fail_fast

steps:
  # Step 1: The shopper agent browses products, picks items, carts them, and checks out.
  - id: browse_and_checkout
    type: agent
    agent: shopper
    inputs:
      shopping_list: inputs.shopping_list

  # Step 2: The payer agent checks balance, pays, and confirms the order.
  - id: pay_and_confirm
    type: agent
    agent: payer
    inputs:
      order_id: steps.browse_and_checkout.order_id
      total: steps.browse_and_checkout.total

  # Step 3: Echo the final result to the user.
  - id: result
    type: tool
    tool: tools.echo
    inputs:
      message: steps.pay_and_confirm
